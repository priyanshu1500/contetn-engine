<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { width:1080px; height:1350px; background:#F5EBDD;
         font-family:-apple-system,Segoe UI,Arial,sans-serif; overflow:hidden; }
  .wrap { padding:70px 60px; height:100%; display:flex; flex-direction:column; justify-content:center; }
  .label { color:#8A7F6E; font-size:22px; letter-spacing:3px; text-transform:uppercase; margin-bottom:28px; font-weight:700; }
  .card { background:#FFFFFF; border:2px solid #E5D9C4; border-radius:20px; padding:36px;
          box-shadow:0 10px 0 #E5D9C4; }
  .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
  .name { color:#413333; font-size:30px; font-weight:700; }
  .tag { background:rgba(242,118,94,.14); color:#F2765E; font-size:16px; font-weight:700;
         padding:6px 14px; border-radius:999px; letter-spacing:1px; }
  .field { display:flex; justify-content:space-between; padding:14px 0; border-top:1px solid #EEE3D2; }
  .field .k { color:#8A7F6E; font-size:19px; }
  .field .v { color:#413333; font-size:19px; font-weight:600; }
  .draft { margin-top:24px; background:#F9F3E9; border:2px dashed #D9CBB0; border-radius:12px; padding:18px; }
  .draft .k { color:#4E71FF; font-size:15px; font-weight:700; letter-spacing:1px; margin-bottom:8px; }
  .draft .v { color:#5A5048; font-size:17px; line-height:1.5; }
</style></head>
<body>
  <div class="wrap">
    <div class="label">the payoff · crm row, auto-created</div>
    <div class="card">
      <div class="card-top"><div class="name">Aditi Rao</div><div class="tag">HOT LEAD</div></div>
      <div class="field"><div class="k">Intent</div><div class="v">Pricing — Enterprise tier</div></div>
      <div class="field"><div class="k">Source</div><div class="v">Inbound email</div></div>
      <div class="field"><div class="k">Logged</div><div class="v">Auto · 0 clicks</div></div>
      <div class="draft">
        <div class="k">DRAFT REPLY — READY TO SEND</div>
        <div class="v">"Hi Aditi — happy to walk through Enterprise pricing. Does Thursday 3pm work for a quick call?"</div>
      </div>
    </div>
  </div>
</body></html>
